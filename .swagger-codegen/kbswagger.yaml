swagger: "2.0"
info:
  title: "Kill Bill"
  description: "Kill Bill is an open-source billing and payments platform"
  contact:
    name: "killbilling-users@googlegroups.com"
  license:
    name: "Apache License, Version 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
  version: "0.25.6-SNAPSHOT"
tags:
- name: "Account"
- name: "Admin"
- name: "Bundle"
- name: "Catalog"
- name: "Credit"
- name: "CustomField"
- name: "Export"
- name: "InvoiceItem"
- name: "InvoicePayment"
- name: "Invoice"
- name: "NodesInfo"
- name: "Overdue"
- name: "PaymentGateway"
- name: "PaymentMethod"
- name: "Payment"
- name: "PluginInfo"
- name: "Security"
- name: "Subscription"
- name: "TagDefinition"
- name: "Tag"
- name: "Tenant"
- name: "PaymentTransaction"
- name: "Usage"
securityDefinitions:
  basicAuth:
    type: "basic"
  Killbill Api Key:
    type: "apiKey"
    name: "X-Killbill-ApiKey"
    in: "header"
  Killbill Api Secret:
    type: "apiKey"
    name: "X-Killbill-ApiSecret"
    in: "header"
paths:
  /1.0/kb/accounts/{accountId}/block:
    get:
      tags:
      - "Account"
      summary: "Retrieve blocking states for account"
      operationId: "getBlockingStates"
      parameters:
      - name: "accountId"
        in: "path"
        required: true
        type: "string"
        format: "uuid"
        pattern: "\\w+-\\w+-\\w+-\\w+-\\w+"
      - name: "blockingStateTypes"
        in: "query"
        type: "array"
        items:
          type: "string"
          enum:
          - "SUBSCRIPTION"
          - "SUBSCRIPTION_BUNDLE"
          - "ACCOUNT"
        collectionFormat: "multi"
        required: false
      - name: "blockingStateSvcs"
        in: "query"
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
        required: false
      - name: "audit"
        in: "query"
        required: false
        type: "string"
        default: "NONE"
        enum:
        - "FULL"
        - "MINIMAL"
        - "NONE"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/BlockingState"
        "400":
          description: "Invalid account id supplied"
      security:
      - basicAuth: []
      - Killbill Api Key: []
      - Killbill Api Secret: []
      produces:
      - "application/json"
    post:
      tags:
      - "Account"
      summary: "Block an account"
      operationId: "addAccountBlockingState"
      parameters:
      - name: "accountId"
        in: "path"
        required: true
        type: "string"
        format: "uuid"
        pattern: "\\w+-\\w+-\\w+-\\w+-\\w+"
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/BlockingState"
      - name: "requestedDate"
        in: "query"
        type: "string"
        format: "date"
        required: false
      - name: "pluginProperty"
        in: "query"
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
        required: false
      - name: "X-Killbill-CreatedBy"
        in: "header"
        required: true
        type: "string"
      - name: "X-Killbill-Reason"
        in: "header"
        type: "string"
        required: false
      - name: "X-Killbill-Comment"
        in: "header"
        type: "string"
        required: false
      responses:
        "201":
          description: "Blocking state created successfully"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/BlockingState"
        "400":
          description: "Invalid account id supplied"
        "404":
          description: "Account not found"
      security:
      - basicAuth: []
      - Killbill Api Key: []
      - Killbill Api Secret: []
      consumes:
      - "application/json"
